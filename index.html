<script>
(function(){var v=document.getElementById('film'),b=document.getElementById('bigplay'),kp=document.getElementById('kPlay'),ks=document.getElementById('kSound');
  function sync(){var on=!v.paused&&!v.ended;kp.setAttribute('aria-pressed',String(on));kp.querySelector('span').textContent=on?'Pause':'Play';
    ks.setAttribute('aria-pressed',String(v.muted));ks.querySelector('span').textContent=v.muted?'Sound off':'Sound on';}
  function go(){b.hidden=true;v.controls=true;var p=v.play();if(p&&p.catch)p.catch(function(){b.hidden=false;});}
  b.addEventListener('click',go);
  kp.addEventListener('click',function(){if(v.paused||v.ended)go();else v.pause();});
  ks.addEventListener('click',function(){v.muted=!v.muted;sync();});
  ['play','pause','ended','volumechange'].forEach(function(e){v.addEventListener(e,sync);});
  v.addEventListener('play',function(){b.hidden=true;v.controls=true;});
  // stop the song when the reader leaves it: a jump to the interactives (the Start button or a chapter
  // link), or scrolling the TV mostly off screen. It doesn't restart on its own when they scroll back.
  // (never while it fills the screen: iPhone fullscreen and picture in picture don't use the standard API)
  function big(){return document.fullscreenElement||document.webkitFullscreenElement||document.pictureInPictureElement===v||v.webkitDisplayingFullscreen||(v.webkitPresentationMode&&v.webkitPresentationMode!=='inline');}
  function away(){if(!v.paused&&!big())v.pause();}
  document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="#"],a[href$=".html"]');if(a&&a.getAttribute('href')!=='#top')away();});
  if('IntersectionObserver' in window)new IntersectionObserver(function(es){if(es[0].intersectionRatio<0.5)away();},{threshold:[0,0.25,0.5,0.75,1]}).observe(v);
  sync();})();
</script>
